<!DOCTYPE html>
<html lang="hu">
<head>
  <!--
    A $FLUTTER_BASE_HREF helyére a Flutter fordításkor beírja az app webes
    útvonalát. Ezt ne módosítsd.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Adatalapú AI fitnesz- és étrend-asszisztens.">

  <!-- iPhone: teljes képernyős mód, név és ikon a kezdőképernyőn -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitAI">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- A böngészőfül színe és ikonja -->
  <meta name="theme-color" content="#3D5A80">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FitAI</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
